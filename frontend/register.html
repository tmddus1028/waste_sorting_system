<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Waste Sorting System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="back-button" aria-label="Go back home">
            <span class="back-button-icon"></span>
        </a>
        <div class="auth-card">
            <h1>회원가입</h1>

            <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>

            <div class="form-group">
                <label>이름</label>
                <div class="input-row">
                    <input type="text" id="name" placeholder="이름을 입력하세요">
                </div>
            </div>

            <div class="form-group">
                <label>이메일</label>
                <div class="input-row">
                    <input type="email" id="email" placeholder="이메일을 입력하세요">
                </div>
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <div class="input-row password-row">
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                    <button class="toggle-password password-toggle" type="button" aria-label="비밀번호 보기">
                        <span class="password-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>비밀번호 확인</label>
                <div class="input-row password-row">
                    <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요">
                    <button class="toggle-password password-toggle" type="button" aria-label="비밀번호 보기">
                        <span class="password-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <button class="btn-filled" id="registerButton">회원가입</button>

            <div class="auth-footer">
                <span>이미 계정이 있으신가요?</span>
                <a href="login.html">로그인</a>
            </div>
        </div>
    </div>

    <script type="module" src="supabase-client.js?v=20260514-3"></script>
    <script type="module" src="script.js?v=20260514-7"></script>
    <script type="module" src="register.js?v=20260516-eye-toggle"></script>
</body>
</html>

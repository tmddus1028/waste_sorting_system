<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Waste Sorting System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container login-container">
        <a href="index.html" class="back-button" aria-label="Go back home">
            <span class="back-button-icon"></span>
        </a>

        <div class="auth-card login-card">
            <h1>로그인</h1>

            <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>

            <div class="login-form-group">
                <label for="username">이메일</label>
                <input type="email" id="username" placeholder="이메일을 입력하세요">
            </div>

            <div class="login-form-group">
                <label for="password">비밀번호</label>
                <div class="login-password-row">
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                    <button class="login-password-toggle password-toggle" type="button" aria-label="비밀번호 보기">
                        <span class="password-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <div class="login-options">
                <label class="remember-check">
                    <input type="checkbox" id="rememberId">
                    <span class="checkmark"></span>
                    <span>아이디 저장</span>
                </label>
            </div>

            <button class="btn-filled login-submit" id="loginButton">로그인</button>

            <div class="auth-footer login-footer">
                <span>계정이 없으신가요?</span>
                <a href="register.html">회원가입</a>
            </div>
        </div>
    </div>

    <script type="module" src="supabase-client.js?v=20260514-3"></script>
    <script type="module" src="script.js?v=20260514-7"></script>
    <script type="module" src="login.js?v=20260516-eye-toggle"></script>
</body>
</html>

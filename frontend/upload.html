<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쓰레기 사진 업로드 - Waste Sorting System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container upload-container">
        <a href="index.html" class="back-button" aria-label="Go back home">
            <span class="back-button-icon"></span>
        </a>

        <div class="auth-card upload-card">
            <h1>쓰레기 사진 업로드</h1>

            <div class="upload-dropzone" id="uploadDropzone">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <input type="file" id="mobileCameraInput" accept="image/*" capture="environment" hidden>
                <div id="imagePreview" class="upload-preview">
                    <svg class="upload-camera-icon" viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="20" width="40" height="30" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
                        <path d="M24 20l4-7h8l4 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="32" cy="35" r="9" fill="none" stroke="currentColor" stroke-width="4"/>
                        <circle cx="45" cy="27" r="2.5" fill="currentColor"/>
                    </svg>
                    <strong>사진을 찍거나 파일을 선택하세요</strong>
                    <span>(JPG, PNG, 최대 10MB)</span>
                </div>
                <div id="cameraPanel" class="camera-panel" hidden>
                    <video id="cameraVideo" autoplay playsinline></video>
                    <div class="camera-actions">
                        <button type="button" id="captureButton">촬영하기</button>
                        <button type="button" id="closeCameraButton">카메라 닫기</button>
                    </div>
                </div>
            </div>

            <div class="upload-actions">
                <button type="button" id="cameraButton" class="upload-choice-button">
                    <svg class="upload-button-icon" viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="20" width="40" height="30" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
                        <path d="M24 20l4-7h8l4 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="32" cy="35" r="9" fill="none" stroke="currentColor" stroke-width="4"/>
                        <circle cx="45" cy="27" r="2.5" fill="currentColor"/>
                    </svg>
                    <span>카메라 촬영</span>
                </button>
                <button type="button" id="fileButton" class="upload-choice-button">
                    <svg class="upload-button-icon" viewBox="0 0 64 64" aria-hidden="true">
                        <path d="M10 20h17l6 7h21v23a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5V20z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M10 28h44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                    <span>파일 선택</span>
                </button>
            </div>

            <button class="btn-filled upload-submit" id="uploadButton">업로드</button>
        </div>
    </div>

    <script type="module" src="supabase-client.js?v=20260514-3"></script>
    <script type="module" src="script.js?v=20260514-7"></script>
    <script type="module" src="upload.js?v=20260516-camera"></script>
</body>
</html>
